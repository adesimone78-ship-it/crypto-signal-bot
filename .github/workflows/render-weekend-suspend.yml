name: Sospendi bot Render (weekend)

on:
  schedule:
    # 23:00 UTC = sabato 00:00 ora solare / 01:00 ora legale: sempre già sabato in Italia,
    # così il keep-alive (che salta sab/dom ora italiana) non riaccende il bot.
    - cron: '0 23 * * 5'
  workflow_dispatch: {}

jobs:
  suspend:
    runs-on: ubuntu-latest
    steps:
      - name: Sospendi servizio Render
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/${{ vars.RENDER_SERVICE_ID }}/suspend" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json"
