name: Sospendi bot Render (weekend)

on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch: {}

jobs:
  suspend:
    runs-on: ubuntu-latest
    steps:
      - name: Sospendi servizio Render
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/${{ vars.RENDER_SERVICE_ID }}/suspend" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json"
